<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VFX Ones vs Twos</title>
<style>
  :root { --bg: #111015; --fg: #e8e6ef; --dim: #8a8698; --line: #2a2733; --accent: #ffd54a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; gap: 16px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header b { color: var(--accent); }
  header span { color: var(--dim); }
  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px; min-height: 0; }
  .pane { position: relative; display: flex; flex-direction: column; min-height: 0; }
  .pane h2 { margin: 0 0 6px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  .pane h2 b { color: var(--fg); }
  .frame { position: relative; flex: 1; aspect-ratio: 16 / 9; max-height: 100%; border: 1px solid var(--line); }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  /* swallow clicks so keyboard focus stays on this page, which forwards keys to both */
  .shield { position: absolute; inset: 0; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <b>Ones vs Twos</b>
  <span>Same arena, same spell, same keys. Keys go to both sides: 1-9 spell · Tab page · B floor · S slow-mo · Space pause · P VFX · R restart both in sync</span>
</header>
<main>
  <section class="pane">
    <h2><b>Ones</b> · effects step every frame</h2>
    <div class="frame"><iframe id="a" src="index.html?twos=0&page=fire"></iframe><div class="shield"></div></div>
  </section>
  <section class="pane">
    <h2><b>Twos</b> · effects step at 30 Hz</h2>
    <div class="frame"><iframe id="b" src="index.html?twos=1&page=fire"></iframe><div class="shield"></div></div>
  </section>
</main>
<script>
  const frames = [document.getElementById('a'), document.getElementById('b')];
  const page = new URLSearchParams(location.search).get('page');
  if (page) frames.forEach((f, i) => f.src = `index.html?twos=${i}&page=${page}`);
  const CODES = { Tab: 9, Space: 32 };
  function send(type, e) {
    for (const f of frames) {
      try {
        const doc = f.contentWindow.document;
        const target = doc.querySelector('canvas') || doc;
        const ev = new KeyboardEvent(type, { key: e.key, code: e.code, keyCode: e.keyCode || CODES[e.code] || 0, which: e.keyCode, bubbles: true, cancelable: true });
        target.dispatchEvent(ev);
      } catch (err) { /* frame still loading */ }
    }
  }
  addEventListener('keydown', e => {
    if (e.code === 'KeyT') return;          // each side keeps its own stepping
    e.preventDefault();
    send('keydown', e);
  });
  addEventListener('keyup', e => { if (e.code !== 'KeyT') { e.preventDefault(); send('keyup', e); } });
  document.querySelectorAll('.shield').forEach(s => s.addEventListener('mousedown', e => { e.preventDefault(); window.focus(); }));
</script>
</body>
</html>
