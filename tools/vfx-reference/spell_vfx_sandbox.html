<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Spell VFX Sandbox</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#f6f5f2;--fg:#1d1b20;--muted:#6b6872;--line:#d3d0ca}
@media (prefers-color-scheme:dark){:root{--bg:#141317;--fg:#eceaf0;--muted:#9a97a3;--line:#34313a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif;padding:16px}
.wrap{max-width:860px;margin:0 auto}
canvas{width:100%;image-rendering:pixelated;border-radius:8px;display:block;background:#1f1c25}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 6px}
button{font:inherit;font-size:13px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
button.on{border-color:var(--fg);font-weight:500}
.row{display:flex;align-items:center;gap:10px;margin:6px 0}
.row label{width:60px;color:var(--muted);font-size:13px}
.row input{flex:1}
#desc{color:var(--muted);font-size:13px;margin:8px 0 0;min-height:40px}
</style>
</head>
<body>
<div class="wrap">
<canvas id="c" width="192" height="108"></canvas>
<div class="btns" id="elements"></div>
<div class="btns" id="spells"></div>
<div class="btns">
  <button id="slow">Slow-mo: off</button>
  <button id="pause">Pause</button>
</div>
<div class="row"><label>Wind</label><input id="wind" type="range" min="-40" max="40" step="1" value="0"><span id="wind-o" style="min-width:28px">0</span></div>
<p id="desc"></p>
</div>
<script>
/* =====================================================================
   FIRE VFX SANDBOX — every fire component, built on one engine.

   ENGINE (shared by every element):
     Noise, PixelBuffer, HeatField (emissive density), flame/smoke/ember/
     debris particles, attach points {inherit, grip}, rings, decals,
     area floors (disk, line, trail union, warning), juice (hit-stop, shake).
   DATA (per element): MAT.fire, MAT.arcane, MAT.earth below.
   COMPONENTS (per component type, element-agnostic):
     projectile(), damageDisk(), field(), trailPatch(), wall(), novaFront(),
     warning(), fallingCarrier(), burning status.
   SPELLS: component chains, see SPELLS at the bottom.
   ===================================================================== */

const W = 192, H = 108;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const img = ctx.createImageData(W, H), px = new Uint32Array(img.data.buffer);
const B4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const bayer = (x, y) => B4[((y & 3) << 2) | (x & 3)] / 16;
const rnd = Math.random, TAU = Math.PI * 2;
const hex = h => { const n = parseInt(h.slice(1), 16); return ((255 << 24) | ((n & 255) << 16) | (((n >> 8) & 255) << 8) | ((n >> 16) & 255)) >>> 0; };
function put(x, y, c) { x = Math.round(x); y = Math.round(y); if (x < 0 || y < 0 || x >= W || y >= H) return; px[y * W + x] = c; }

/* ---------- noise ---------- */
function hs(x, y) { let n = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0; n = Math.imul(n ^ (n >>> 13), 1274126177); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; }
function vn(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf); const a = hs(xi, yi), b = hs(xi + 1, yi), c = hs(xi, yi + 1), d = hs(xi + 1, yi + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }

/* ---------- element data ---------- */
const MAT_SRC = {
  fire: {
    heat: [[1.6, '#fff7d6'], [1.1, '#ffd54a'], [0.7, '#ff8a1f'], [0.35, '#e0401c'], [0.12, '#7a1f14']],
    glow: '#3a1a12', ember: ['#fff7d6', '#ffd54a', '#ff8a1f', '#e0401c'], smoke: ['#4a4452', '#332e3b'],
    body: { core: '#fff7d6', light: '#ffd54a', mid: '#ff8a1f', dark: '#c2361a', outline: '#4a1610' },
    rim: ['#ff8a1f', '#ffd54a'], floor: ['#2a1416', '#3a1512', '#5a1a12'], scorch: ['#141010', '#211715'],
    ring: ['#fff7d6', '#ffd54a', '#ff8a1f', '#e0401c'], warn: ['#3a1512', '#e0401c']
  },
  arcane: { body: { core: '#ffffff', light: '#bdf3ff', mid: '#6fc9e8', dark: '#3a6fb5', outline: '#1c2450' }, spark: ['#ffffff', '#bdf3ff', '#6fc9e8', '#3a6fb5'] },
  earth: { body: { core: '#e8dcc0', light: '#c9b48c', mid: '#9a7d5a', dark: '#5e4630', outline: '#2a1e16' }, debris: ['#c9b48c', '#9a7d5a', '#5e4630'] }
};
function compile(o) { if (typeof o === 'string') return hex(o); if (Array.isArray(o)) return o.map(v => Array.isArray(v) ? [v[0], hex(v[1])] : compile(v)); const r = {}; for (const k in o) r[k] = compile(o[k]); return r; }
const MAT = compile(MAT_SRC);
const C = compile({ floorA: '#1f1c25', floorB: '#25222c', floorC: '#1b1820', enemy: '#5b4a6e', enemyO: '#2a2233', eye: '#e8e0f0', flash: '#ffffff', hat: '#5a3f9e', face: '#f0c9a0', robe: '#3b4f9e', shadow: '#16141b', ink: '#120e14', lit1: '#2a2028', lit2: '#382426', burnBody: '#7a4a5a' });

/* static floor */
const floorPx = new Uint32Array(W * H);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const n = vn(x * 0.35, y * 0.35) + hs(x, y) * 0.25; floorPx[y * W + x] = n > 0.82 ? C.floorB : n < 0.25 ? C.floorC : C.floorA; }

/* ---------- state ---------- */
let T = 0, frame = 0, wind = 0, slow = false, paused = false, stop = 0, shakeT = 0, shakeA = 0;
let later = [], flashes = [], flames = [], smoke = [], embers = [], debris = [], rings = [], decals = [], areas = [], projs = [], falls = [], sparks = [], novas = [], enemies = [];
const heat = new Float32Array(W * H), blur = new Float32Array(W * H);
const player = { x: 22, y: 56, vx: 0, vy: 0 };
const STATIC = (x, y) => ({ x, y, vx: 0, vy: 0 });
const drag = (v, dt, k) => v * Math.pow(k, dt * 60);
const turb = (x, y, s) => (vn(x * 0.12, y * 0.12 + T * 3) - 0.5) * s;

/* ---------- particles ---------- */
// attach point: inherit = share of anchor velocity at birth; grip = local->world blend over life
function flame(a, o) {
  const lx = o.lx || 0, ly = o.ly || 0, inh = o.inh || 0;
  flames.push({ a, lx, ly, wx: a.x + lx, wy: a.y + ly, vx: (o.vx || 0) + a.vx * inh, vy: (o.vy || 0) + a.vy * inh, dvx: 0, dx: 0, dy: 0,
    rise: o.rise ?? 20, age: 0, life: o.life ?? 0.6, heat: o.heat ?? 1.2, gx: 0.2 + (o.grip ?? 0) * 2.8, small: o.small || 0, soul: !!o.soul });
}
function ember(x, y, vx, vy, life) { embers.push({ x, y, vx, vy, age: 0, life }); }
function puff(x, y, s) { smoke.push({ x, y, vx: 0, rise: 6 + rnd() * 5, age: 0, life: 1.6 + rnd() * 1.2, s: s || 2 + (rnd() * 2 | 0) }); }
function chunk(x, y, vx, vy, vz, cols, life, size) { debris.push({ x, y, z: 1, vx, vy, vz, cols, age: 0, life, size: size || 1, bounced: false }); }

/* ---------- juice ---------- */
function shake(a, t) { shakeA = Math.max(shakeA, a); shakeT = Math.max(shakeT, t); }
function hitstop(f) { stop = Math.max(stop, f); }
function hit(e, burn) { e.flash = 0.08; e.burn = Math.max(e.burn, burn); }
function knock(e, dx, dy, f) { const L = Math.hypot(dx, dy) || 1; e.kx = (e.kx || 0) + dx / L * f; e.ky = (e.ky || 0) + dy / L * f * 0.8; }

/* =====================================================================
   COMPONENTS (element-agnostic shapes; fire look passed in)
   ===================================================================== */

// Payload: damage disk (impact). size scales everything together.
function damageDisk(x, y, s, o = {}) {
  const a = STATIC(x, y), m = MAT.fire, lk = 0.8 + 0.3 * s;
  if (s >= 0.8) flashes.push({ x, y, r: 3.5 * s, age: 0, life: 0.07 });
  const big = s >= 1;
  for (let i = 0, n = Math.round((big ? 40 : 26) * s); i < n; i++) {
    const ang = rnd() * TAU, sp = (big ? 20 + rnd() * 75 : 25 + rnd() * 55) * s;
    flame(a, { lx: Math.cos(ang), ly: Math.sin(ang), vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp * 0.8, rise: 10 + rnd() * 12, life: (big ? 0.35 + rnd() * 0.35 : 0.28 + rnd() * 0.3) * lk, heat: big ? 1.75 : 1.5 });
  }
  if (big) {
    later.push({ t: 0.07, run() { for (let i = 0; i < 18 * s; i++) { const ang = rnd() * TAU; flame(STATIC(x + Math.cos(ang) * 6 * s, y + Math.sin(ang) * 5 * s), { vx: Math.cos(ang) * 14, vy: Math.sin(ang) * 10, rise: 16 + rnd() * 10, life: 0.45 + rnd() * 0.3, heat: 1.35 }); } } });  // rolling second wave
    field(x, y, 7 * s, 1.3, { rate: 0.9, heatK: 0.75 });            // lingering ground fire
  }
  if (s >= 1) for (let i = 0; i < 10 * s; i++) flame(a, { lx: (rnd() - 0.5) * 4 * s, ly: (rnd() - 0.5) * 3 * s, rise: 24 + rnd() * 14, life: 0.6 + rnd() * 0.4, heat: 1.3 });  // rising mushroom
  for (let i = 0, n = Math.round((big ? 16 : 10) * s); i < n; i++) { const ang = rnd() * TAU, sp = (18 + rnd() * 34) * s; chunk(x, y, Math.cos(ang) * sp, Math.sin(ang) * sp * 0.7, 40 + rnd() * 60, m.ember, 0.8 + rnd() * 0.6, 1); }
  if (o.rock) for (let i = 0, n = Math.round(7 * s); i < n; i++) { const ang = rnd() * TAU, sp = (14 + rnd() * 30) * s; chunk(x, y, Math.cos(ang) * sp, Math.sin(ang) * sp * 0.7, 50 + rnd() * 50, MAT.earth.debris, 1.6 + rnd(), 1 + (rnd() < 0.4 ? 1 : 0)); }
  for (let i = 0, n = Math.round((big ? 7 : 4) * s); i < n; i++) puff(x + (rnd() - 0.5) * 8 * s, y - 4 * s - rnd() * 4, 2 + (big ? 1 : 0));
  if (s >= 0.8) rings.push({ x, y, max: (big ? 20 : 14) * s, age: 0, life: big ? 0.42 : 0.35 });
  if (!o.nodecal) decals.push({ x, y, r: 6.5 * s, age: 0, life: 6, seed: rnd() * 100 });
  if (s >= 1) { shake(Math.min(3, s * 1.3), 0.2); hitstop(o.stop ?? 3); } else if (s >= 0.5) hitstop(1);
  const R = 9 * s + 3;
  for (const e of enemies) if (Math.hypot(e.x - x, e.y - 3 - y) < R) hit(e, 3);
}

// Delivery: projectile. body + trail emitted per distance, impact on contact.
function projectile(o) {
  const tgt = nearestEnemy(player.x, player.y), dx = tgt.x - player.x, dy = tgt.y - 3 - player.y, L = Math.hypot(dx, dy) || 1;
  projs.push({ x: player.x + 3, y: player.y - 4, vx: dx / L * o.speed, vy: dy / L * o.speed, acc: 0, hits: new Set(), age: 0, ...o });
}

// Delivery: field (persistent area). dim floor, bright rim at true radius, ambient emitter.
function field(x, y, r, life, o = {}) { areas.push({ kind: 'disk', x, y, r, age: 0, life, rate: o.rate ?? 1, trail: !!o.trail, heatK: o.heatK ?? 0.8 }); }

// Delivery: wall (line mask area). rim along both edges, flames rising along the line.
function wall(x1, y1, x2, y2, hw, life) { areas.push({ kind: 'line', x1, y1, x2, y2, hw, age: 0, life }); }

// Timing: warning disk. fill grows to the real radius exactly at impact time.
function warning(x, y, r, delay) { areas.push({ kind: 'warn', x, y, r, age: 0, life: delay }); }

// Delivery: falling carrier (visual only; the damage disk is the hit).
function fallingCarrier(tx, ty, delay, onLand) { falls.push({ tx, ty, x: tx + 34, z: 96, t: -delay, dur: 0.42, acc: 0, onLand, vx: 0, vy: 0 }); }

// Propagation: expanding front. only the band is active; each enemy is hit once.
function novaFront(x, y, max, dur) {
  novas.push({ x, y, r: 0, max, dur, age: 0, hit: new Set() });
  flashes.push({ x, y, r: 4, age: 0, life: 0.07 }); rings.push({ x, y, max: max * 0.55, age: 0, life: 0.22 });
  for (let i = 0; i < 18; i++) { const a = rnd() * TAU; flame(STATIC(x, y), { vx: Math.cos(a) * 40, vy: Math.sin(a) * 30, rise: 12, life: 0.25, heat: 1.6 }); }
  shake(1.5, 0.12); hitstop(2);
}

/* =====================================================================
   UPDATE
   ===================================================================== */
function nearestEnemy(x, y) { let b = enemies[0], bd = 1e9; for (const e of enemies) { const d = Math.hypot(e.x - x, e.y - y); if (d < bd) { bd = d; b = e; } } return b; }

function updateProjectiles(dt) {
  projs = projs.filter(p => {
    p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt;
    const dist = Math.hypot(p.vx, p.vy) * dt, t = p.trail;
    p.acc += t.rate * dt * 60 + dist * t.perDist;           // per time + per distance
    const sp = Math.hypot(p.vx, p.vy) || 1, back = (p.body.a || p.body.r) * 0.9;
    while (p.acc >= 1) { p.acc--; flame(p, { lx: -p.vx / sp * back + (rnd() + rnd() - 1) * t.spread, ly: -p.vy / sp * back + (rnd() + rnd() - 1) * t.spread * 0.8, inh: t.inh, grip: t.grip, heat: t.heat, rise: 16 + rnd() * 10, life: 0.28 + rnd() * 0.3, small: t.small || 0 }); }
    if (rnd() < t.ember * dt * 60) ember(p.x, p.y, p.vx * 0.3 + (rnd() - 0.5) * 16, -(12 + rnd() * 16), 0.6 + rnd() * 0.7);
    if (p.native === 'arcane') for (let i = 0; i < 2; i++) sparks.push({ x: p.x + (rnd() - 0.5) * 3, y: p.y + (rnd() - 0.5) * 3, vx: -p.vx * 0.05, vy: -p.vy * 0.05, age: 0, life: 0.35 + rnd() * 0.25 });
    for (const e of enemies) {
      if (p.hits.has(e) || Math.hypot(e.x - p.x, e.y - 3 - p.y) > 4.5) continue;
      if (p.pierce) { p.hits.add(e); damageDisk(p.x, p.y, 0.35, { nodecal: true, stop: 0 }); hit(e, 3); }
      else { damageDisk(p.x, p.y, p.impact, {}); if (p.native === 'arcane') for (let i = 0; i < 8; i++) { const a = rnd() * TAU; sparks.push({ x: p.x, y: p.y, vx: Math.cos(a) * 30, vy: Math.sin(a) * 30, age: 0, life: 0.3 }); } return false; }
    }
    return p.x > -8 && p.x < W + 8 && p.y > -8 && p.y < H + 8 && p.age < 3;
  });
}

function updateAreas(dt) {
  areas = areas.filter(A => {
    A.age += dt; if (A.age > A.life) return false;
    if (A.kind === 'disk') {
      const n = A.r * A.r * 0.0042 * A.rate * dt * 60;
      for (let i = 0; i < n / 3 || (i === 0 && rnd() < n / 3); i++) {       // spawn tongues: small clusters that sum into one rising flame
        const ang = rnd() * TAU, d = Math.sqrt(rnd()) * A.r * 0.9, a = STATIC(A.x + Math.cos(ang) * d, A.y + Math.sin(ang) * d), rise = 20 + rnd() * 12, life = 0.45 + rnd() * 0.35;
        for (let j = 0; j < 3; j++) flame(a, { lx: (rnd() - 0.5) * 1.5, ly: (rnd() - 0.5), heat: A.heatK * 0.46, rise: rise * (0.9 + j * 0.18), life: life * (1 - j * 0.15), small: j ? 1 : 0 });
      }
      if (rnd() < A.r * 0.004 * dt * 60) ember(A.x + (rnd() - 0.5) * A.r, A.y + (rnd() - 0.5) * A.r * 0.6, (rnd() - 0.5) * 10, -(14 + rnd() * 14), 0.8 + rnd());
      if (!A.trail && rnd() < A.r * 0.003 * dt * 60) puff(A.x + (rnd() - 0.5) * A.r, A.y - 6 + (rnd() - 0.5) * A.r * 0.4);
      for (const e of enemies) if (Math.hypot(e.x - A.x, e.y - 1 - A.y) < A.r) e.burn = Math.max(e.burn, 0.8);
    } else if (A.kind === 'line') {
      const len = Math.hypot(A.x2 - A.x1, A.y2 - A.y1), nx = -(A.y2 - A.y1) / len, ny = (A.x2 - A.x1) / len;
      const n = len * 0.09 * dt * 60;
      for (let i = 0; i < n; i++) { const t = rnd(), j = (rnd() - 0.5) * A.hw * 1.4; flame(STATIC(A.x1 + (A.x2 - A.x1) * t + nx * j, A.y1 + (A.y2 - A.y1) * t + ny * j), { heat: 1.15, rise: 24 + rnd() * 12, life: 0.45 + rnd() * 0.35 }); }
      if (rnd() < 0.2 * dt * 60) { const t = rnd(); ember(A.x1 + (A.x2 - A.x1) * t, A.y1 + (A.y2 - A.y1) * t, (rnd() - 0.5) * 8, -(20 + rnd() * 14), 1 + rnd()); }
      for (const e of enemies) if (distSeg(e.x, e.y - 1, A) < A.hw + 1.5) e.burn = Math.max(e.burn, 1.2);
    }
    return true;
  });
}
function distSeg(x, y, A) { const dx = A.x2 - A.x1, dy = A.y2 - A.y1, t = Math.max(0, Math.min(1, ((x - A.x1) * dx + (y - A.y1) * dy) / (dx * dx + dy * dy))); return Math.hypot(x - A.x1 - dx * t, y - A.y1 - dy * t); }

function updateFalls(dt) {
  falls = falls.filter(f => {
    f.t += dt; if (f.t < 0) return true;
    const k = Math.min(1, f.t / f.dur), px0 = f.x, pz0 = f.z;
    f.x = f.tx + 34 * (1 - k); f.z = 96 * (1 - k);
    f.vx = (f.x - px0) / dt; f.vy = -(f.z - pz0) / dt;           // screen-space velocity of the carrier
    const a = { x: f.x, y: f.ty - f.z, vx: f.vx, vy: f.vy };
    f.acc += 5 * dt * 60;
    while (f.acc >= 1) { f.acc--; flame(a, { lx: (rnd() - 0.5) * 3, ly: (rnd() - 0.5) * 3, inh: 0.15, grip: 0.1, heat: 1.35, rise: 10 + rnd() * 8, life: 0.25 + rnd() * 0.25 }); }
    if (k >= 1) { f.onLand(f.tx, f.ty); return false; }
    return true;
  });
}

function updateNovas(dt) {
  novas = novas.filter(N => {
    N.age += dt; const k = Math.min(1, N.age / N.dur); N.r = N.max * (1 - Math.pow(1 - k, 2));
    const n = TAU * N.r * 0.17 * dt * 60;
    for (let i = 0; i < n; i++) { const a = rnd() * TAU, rr = N.r - rnd() * 2.5; flame(STATIC(N.x + Math.cos(a) * rr, N.y + Math.sin(a) * rr), { vx: Math.cos(a) * 22, vy: Math.sin(a) * 16, heat: 1.5 * (1 - k * 0.45), rise: 16 + rnd() * 12, life: 0.28 + rnd() * 0.25 }); }
    if (rnd() < 0.8) { const a = rnd() * TAU; chunk(N.x + Math.cos(a) * N.r, N.y + Math.sin(a) * N.r, Math.cos(a) * 30, Math.sin(a) * 22, 30 + rnd() * 30, MAT.fire.ember, 0.6 + rnd() * 0.4, 1); }
    for (const e of enemies) { if (N.hit.has(e)) continue; if (Math.abs(Math.hypot(e.x - N.x, e.y - 2 - N.y) - N.r) < 3) { N.hit.add(e); hit(e, 3); knock(e, e.x - N.x, e.y - N.y, 6); } }
    if (N.age >= N.dur) for (let i = 0; i < 9; i++) { const a = i / 9 * TAU + rnd() * 0.4; decals.push({ x: N.x + Math.cos(a) * N.max, y: N.y + Math.sin(a) * N.max, r: 2.5 + rnd() * 1.5, age: 0, life: 4, seed: rnd() * 100 }); }
    return N.age < N.dur;
  });
}

function updateEnemies(dt) {
  for (const e of enemies) {
    const ox = e.x, oy = e.y;
    if (e.march) { e.hx -= 9 * dt; if (e.hx < 92) e.hx += 96; }
    e.x = e.hx + Math.sin(e.ph + T * 0.7) * 5 + (e.kx || 0); e.y = e.hy + Math.cos(e.ph * 1.3 + T * 0.5) * 3 + (e.ky || 0);
    e.kx = drag(e.kx || 0, dt, 0.88); e.ky = drag(e.ky || 0, dt, 0.88);
    e.vx = (e.x - ox) / Math.max(dt, 1e-4); e.vy = (e.y - oy) / Math.max(dt, 1e-4);
    e.flash -= dt;
    if (e.stT > 0) { e.stT -= dt; FX[e.st].status(e, dt); }
    if (e.burn > 0) {                                                // status: burning (grip-locked)
      e.burn -= dt;
      for (let i = 0; i < 2; i++) if (rnd() < 0.6 * dt * 60) flame(e, { lx: (rnd() - 0.5) * 6, ly: -2 - rnd() * 4, inh: 0.1, grip: 0.9, heat: 1.05, rise: 18 + rnd() * 10, life: 0.3 + rnd() * 0.3, small: rnd() < 0.5 ? 1 : 0 });
      if (rnd() < 0.03 * dt * 60) ember(e.x, e.y - 5, (rnd() - 0.5) * 8, -(14 + rnd() * 10), 0.7);
    }
  }
}

function updateParticles(dt) {
  flames = flames.filter(f => {
    f.age += dt; if (f.age > f.life) return false;
    const k = f.age / f.life;
    f.dvx += (turb(f.wx + f.dx, f.wy + f.dy, 80) + wind * 1.5) * dt; f.dvx = drag(f.dvx, dt, 0.92);

    e.spreadT -= dt;

    if (k >= 1) { sp.to.pending = false; infect(sp.to, sp.gen); return false; }

  waveEmit(x, y, fx, fy) { flame(STATIC(x, y), { vx: fx * 28, vy: fy * 22, rise: 16, life: 0.3 + rnd() * 0.2, heat: 1.2, soul: true }); if (rnd() < 0.04) bone(x, y, fx * 30, fy * 20, 30); if (rnd() < 0.01) soulRise(x, y); },
  contact(x, y) { soulBurst(x, y, 8, 30); bone(x, y, (rnd() - 0.5) * 20, (rnd() - 0.5) * 14, 30); },
  wallEmit(A, dt) { const n = A.len * 0.07 * dt * 60; for (let i = 0; i < n; i++) { const [x, y] = wallPt(A); flame(STATIC(x, y), { heat: 1.1, rise: 24 + rnd() * 12, life: 0.45 + rnd() * 0.3, soul: true }); } if (rnd() < 0.02 * dt * 60) { const [x, y] = wallPt(A); soulRise(x, y - 6); } },
  spearDraw(p) { drawBody(p.x, p.y, p.vx, p.vy, { t: 'diamond', a: 8, b: 1.6 }, BONE); }
};

/* ---------- Lightning Slash: arcs that follow the swing ---------- */
function drawLightningSlash(s) {
  const k = Math.min(1, s.t / s.dur), cur = s.span * k, A = EL.lightning.arc, linger = s.t > s.dur;
  if (linger && (frame & 1)) return;
  for (let band = 0; band < 3; band++) {
    if (linger && band === 2) continue;
    const r = s.rOut - band * 4, n = Math.max(2, Math.ceil(cur * r / 3)), pts = [];
    for (let i = 0; i <= n; i++) { const a = s.a0 + (i / n) * cur * s.dir, rr = r + (rnd() - 0.5) * 3.5; pts.push([s.cx + Math.cos(a) * rr, s.cy + Math.sin(a) * rr * 0.85]); }
    path(pts, A[band]); if (band === 0) for (const q of pts) put(q[0] + 1, q[1], A[2]);
    if (band === 0 && !linger) for (let b = 0; b < 2; b++) { const q = pts[(rnd() * pts.length) | 0], a = Math.atan2(q[1] - s.cy, q[0] - s.cx); path(jag(q[0], q[1], q[0] + Math.cos(a) * (5 + rnd() * 5), q[1] + Math.sin(a) * (4 + rnd() * 4), 1.5), A[1]); }
  }
  if (!linger) { const a = s.a0 + cur * s.dir; flashes.push({ x: s.cx + Math.cos(a) * s.rOut, y: s.cy + Math.sin(a) * s.rOut * 0.85, r: 1.5, age: 0, life: 0.02, c: A[0] }); }
}
const _drawESlash = drawESlash;
drawESlash = function () { const keep = eslashes; eslashes = keep.filter(s => s.el !== 'lightning'); _drawESlash(); eslashes = keep; for (const s of keep) if (s.el === 'lightning') drawLightningSlash(s); };

/* ---------- Metal: blade storm field and a Cross Blade you can actually see ---------- */
FX.metal.fieldDraw = A => {
  for (let ring = 0; ring < 2; ring++) {
    const dir = ring ? -1 : 1, r = A.r * (ring ? 0.45 : 0.78), n = ring ? 4 : 7;
    for (let i = 0; i < n; i++) {
      const a = T * 4.5 * dir + i / n * TAU;
      for (let t = 1; t <= 5; t++) { const ta = a - dir * t * 0.08, c = t < 2 ? EL.metal.body.light : t < 4 ? EL.metal.body.mid : EL.metal.body.dark; put(A.x + Math.cos(ta) * r, A.y + Math.sin(ta) * r * 0.8, c); put(A.x + Math.cos(ta) * (r - 1), A.y + Math.sin(ta) * (r - 1) * 0.8, c); }
      drawBody(A.x + Math.cos(a) * r, A.y + Math.sin(a) * r * 0.8, -Math.sin(a) * dir, Math.cos(a) * dir, { t: 'diamond', a: 4.5, b: 1.8 }, EL.metal.body, EL.metal.body.light);
    }
  }
};
FX.metal.field = (A, dt) => { for (const e of enemies) if (Math.hypot(e.x - A.x, e.y - A.y) < A.r && rnd() < 0.25) mspark(e.x, e.y - 3, rnd() * TAU, 35); if (rnd() < 0.06 * dt * 60) { const [x, y] = inDisk(A), a = rnd() * TAU; decals.push({ type: 'scratch', ls: [[x, y, x + Math.cos(a) * 6, y + Math.sin(a) * 4]], x, y, r: 4, age: 0, life: 3 }); } };
function drawCrossBlade(s) {
  const M = EL.metal.body, R = 10;
  for (let i = -2; i <= 2; i++) if (i & 1) put(s.x + i * 2, s.y + 8, C.shadow);
  for (let i = 0; i < 32; i++) { if (((i + (frame >> 1)) & 3) === 0) continue; const a = i / 32 * TAU; put(s.x + Math.cos(a) * R, s.y + Math.sin(a) * R * 0.85, (i & 1) ? M.mid : M.light); }   // spin blur
  for (const off of [0, Math.PI / 2]) { const a = s.spin + off; drawBody(s.x, s.y, Math.cos(a), Math.sin(a), { t: 'diamond', a: 9, b: 2.8 }, M, M.light); }
  put(s.x, s.y, M.core); put(s.x - 1, s.y, M.dark); put(s.x + 1, s.y, M.dark);
}
const _drawSlashes = drawSlashes;
drawSlashes = function () { const keep = slashes; slashes = keep.filter(s => s.kind !== 'blade'); _drawSlashes(); slashes = keep; for (const s of keep) if (s.kind === 'blade') drawCrossBlade(s); };
const _updateMatrix = updateMatrix;
updateMatrix = function (dt) { _updateMatrix(dt); updateHands(dt); };
const _drawMatrixTop = drawMatrixTop;
drawMatrixTop = function () { drawHands(); _drawMatrixTop(); };
SPELLS.death_bolt.desc = 'Bolt × Death (soul fire). A skull wreathed in teal-violet soul fire, shedding bone chips → burst of soul fire, bones on z-physics, skulls rising as souls, a skeletal hand clawing up, necrotic veins → soul-burn status.';
SPELLS.death_field.desc = 'Field × Death. Necrotic veins spread across the ground, low soul fire flickers, skeletal hands claw up and sink back, souls drift away.';
SPELLS.water_bolt.desc = 'Bolt × Water. A bright see-through drop throwing spray streaks and droplets → tall splash crown on z-physics, radial spray, three ripples, puddle. No dark outline: water is mostly light.';
SPELLS.plague_bolt.desc = 'Bolt × Plague. A toxic glob trailing bubbles → bubbles boil up in a cluster and pop, small drips stick as a stain → bubbles keep boiling off the target.';

let mode = 'bolt', cd = 0, curEl = 'fire';
function setMode(k) {
  mode = k; cd = 0.2;
  resetMatrix(); eslashes = []; whips = []; hands = []; jets = []; charges = []; ewaves = []; spores = []; eprojs = []; efields = []; enovas = []; blobs = []; bubbles = []; mists = []; shards = []; crystals = []; motes = []; arcs = []; vines = []; leaves = []; blades = []; hops = [];
  later = []; flashes = []; flames = []; smoke = []; embers = []; debris = []; rings = []; decals = []; areas = []; projs = []; falls = []; sparks = []; novas = [];
  player.x = 22; player.y = 56; player.walk = false;
  enemies = BASE_ENEMIES.map(([x, y], i) => ({ hx: x, hy: y, x, y, vx: 0, vy: 0, ph: i * 1.7, flash: 0, burn: 0, st: null, stT: 0, march: false }));
  SPELLS[k].setup?.();
  document.getElementById('desc').textContent = SPELLS[k].desc;
  curEl = SPELLS[k].el; buildBar();
}
const ELNAMES = NAMES;
const elBar = document.getElementById('elements'), bar = document.getElementById('spells');
for (const el in ELNAMES) { const b = document.createElement('button'); b.textContent = ELNAMES[el]; b.dataset.el = el; b.onclick = () => setMode(el === 'fire' ? 'bolt' : el + '_bolt'); elBar.appendChild(b); }
function buildBar() {
  bar.innerHTML = '';
  for (const k in SPELLS) { if (SPELLS[k].el !== curEl) continue; const b = document.createElement('button'); b.textContent = SPELLS[k].name; b.dataset.k = k; b.onclick = () => setMode(k); b.classList.toggle('on', k === mode); bar.appendChild(b); }
  elBar.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.el === curEl));
}
document.getElementById('slow').onclick = e => { slow = !slow; e.target.textContent = 'Slow-mo: ' + (slow ? 'on' : 'off'); };
document.getElementById('pause').onclick = e => { paused = !paused; e.target.textContent = paused ? 'Resume' : 'Pause'; };
const wi = document.getElementById('wind'); wi.oninput = () => { wind = +wi.value; document.getElementById('wind-o').textContent = wi.value; };

let walkAcc = 0, lastPatch = null;
function step(dt) {
  T += dt;
  if (player.walk) {
    const ox = player.x, oy = player.y;
    player.x = 108 + 64 * Math.sin(T * 0.8); player.y = 56 + 24 * Math.sin(T * 1.6);
    player.vx = (player.x - ox) / dt; player.vy = (player.y - oy) / dt;
    if (!lastPatch || Math.hypot(player.x - lastPatch.x, player.y - lastPatch.y) > 5) { lastPatch = { x: player.x, y: player.y + 1 }; field(lastPatch.x, lastPatch.y, 5, 3.2, { trail: true, rate: 1.4, heatK: 0.75 }); }
  }
  cd -= dt; if (cd <= 0) { cd = SPELLS[mode].every; SPELLS[mode].cast?.(); }
  later = later.filter(l => { l.t -= dt; if (l.t <= 0) { l.run(); return false; } return true; });
  updateEnemies(dt); updateElements(dt); updateProjectiles(dt); updateAreas(dt); updateFalls(dt); updateNovas(dt); updateParticles(dt);
}
function render() {
  px.set(floorPx);
  accumulateHeat(); accumulateElements(); drawDecals(); drawEDecals(); drawAreas(); drawEFields(); drawFloorLight(); drawGoo(gooGround); drawWater(wGround, true); drawRings(); drawGround(); drawActors(); drawStatuses(); drawSmoke(); drawSoft(); drawSoft(dSoft, EL.death.tones); drawGoo(gooAir); drawWater(wAir, false); drawHeat(); drawSoulHeat(); drawBodies(); drawFlashes(); drawTop(); drawElementTop();
  ctx.fillStyle = '#1f1c25'; ctx.fillRect(0, 0, W, H);
  let ox = 0, oy = 0; if (shakeT > 0) { ox = Math.round((rnd() - 0.5) * 2 * shakeA); oy = Math.round((rnd() - 0.5) * 2 * shakeA); }
  ctx.putImageData(img, ox, oy);
}
function loop() {
  frame++;
  const dt = (1 / 60) * (slow ? 0.25 : 1);
  if (!paused) { if (stop > 0) stop--; else step(dt); if (shakeT > 0) { shakeT -= dt; if (shakeT <= 0) shakeA = 0; } }
  render();
  requestAnimationFrame(loop);
}
setMode('bolt');
loop();
</script>
