<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spirit studies</title>
<style>
:root{color-scheme:dark;--ink:#e8ecdb;--quiet:#b0c4b9;--field:#263b34;--line:#50675a}
*{box-sizing:border-box}body{margin:0;background:var(--field);color:var(--ink);font:15px/1.5 system-ui,sans-serif}main{min-height:100svh;display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;gap:22px;padding:25px 34px 14px}h1{font:32px/1.2 Georgia,serif;font-weight:400;margin:0}header p{color:var(--quiet);margin:7px 0 0;font-size:13px}nav{display:flex;gap:5px;flex-wrap:wrap}button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:24px;padding:8px 18px;cursor:pointer}button[aria-pressed=true]{background:#d6e2cb;color:#24382f;border-color:#d6e2cb}button:hover{border-color:#bacdbb}button:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid #eee7ba;outline-offset:4px}.stage{position:relative;flex:1;min-height:400px;overflow:hidden}canvas{display:block;width:100%;height:100%;position:absolute;inset:0;touch-action:none}.hint{position:absolute;bottom:18px;left:34px;color:var(--quiet);font-size:13px;pointer-events:none}.status{position:absolute;right:34px;bottom:18px;color:var(--quiet);font:18px Georgia,serif;pointer-events:none}footer{display:flex;gap:22px;align-items:center;justify-content:space-between;padding:15px 34px 24px;flex-wrap:wrap}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}label{display:flex;gap:10px;align-items:center;color:var(--quiet);font-size:13px}input{accent-color:#b7d6c2;width:100px}.note{color:var(--quiet);font-size:12px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:600px){header{padding:20px;align-items:flex-start;flex-direction:column;gap:16px}h1{font-size:28px}.stage{min-height:430px}footer{padding:14px 20px 22px;gap:14px}.hint{left:20px;max-width:230px}.status{right:20px;top:16px;bottom:auto}button{min-height:44px;padding:8px 15px}.note{max-width:260px}}
</style>
</head>
<body>
<main>
<header><div><h1>Spirit studies</h1><p>A little soul. A little mischief.</p></div><nav aria-label="Spirit form"><button data-mode="ghost" aria-pressed="false">Ghost</button><button data-mode="wisp" aria-pressed="false">Wisp</button><button data-mode="both" aria-pressed="true">Both</button></nav></header>
<section class="stage" aria-label="Interactive spirit playground"><canvas id="scene" tabindex="0" aria-label="Ghost and wisp follow your pointer. Arrow keys move their target. Space pauses the animation.">Your browser needs Canvas support to display the spirits.</canvas><div class="hint">Move slowly. Sweep quickly. Stop.<br>Touch or use arrow keys, too.</div><div class="status" id="state">Gathering</div></section>
<footer><div class="controls"><button id="demo" aria-pressed="false">Demo path</button><button id="pause" aria-pressed="false">Pause</button><label>Size <input id="size" type="range" min="0.65" max="1.65" step="0.05" value="1.15" aria-label="Spirit size"></label><label>Tail reach <input id="reach" type="range" min="0.5" max="1.5" step="0.05" value="1" aria-label="Tail reach"></label><label>Follow speed <input id="follow" type="range" min="0.6" max="1.6" step="0.05" value="1" aria-label="Follow speed"></label><label><input id="gentle" type="checkbox" style="width:auto">Gentle motion</label></div><span class="note">Mouse-driven body, folds and curls. No sprite images.</span></footer>
<span class="sr" id="announcement" aria-live="polite"></span>
</main>
<script>
(()=>{
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),stage=canvas.parentElement;
const stateLabel=document.getElementById('state'),announcement=document.getElementById('announcement');
const TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),mix=(a,b,t)=>a+(b-a)*t;
let W=900,H=600,dpr=1,time=0,last=0,mode='both',demo=false,paused=false,size=1.15,reach=1,followSpeed=1,active=false,hasTarget=false,needsRender=true;
let gentle=matchMedia('(prefers-reduced-motion: reduce)').matches;
const pointer={x:450,y:300},motion={speed:0,turn:0},spirits=[];
function makeSpirit(kind){return {kind,x:0,y:0,vx:0,vy:0,angle:-.25,speed:0,turn:0,folds:[],ready:false};}
spirits.push(makeSpirit('ghost'),makeSpirit('wisp'));
function resize(){const r=stage.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);pointer.x=clamp(pointer.x,40,W-40);pointer.y=clamp(pointer.y,40,H-40);for(const s of spirits)s.ready=false;needsRender=true;}
new ResizeObserver(resize).observe(stage);
function targetEvent(e){const r=canvas.getBoundingClientRect();pointer.x=clamp(e.clientX-r.left,30,W-30);pointer.y=clamp(e.clientY-r.top,35,H-60);active=true;hasTarget=true;if(demo)setDemo(false);}
canvas.addEventListener('pointermove',targetEvent);canvas.addEventListener('pointerdown',e=>{canvas.focus();canvas.setPointerCapture(e.pointerId);targetEvent(e)});
canvas.addEventListener('pointerleave',()=>{active=false});
function setDemo(value){demo=value;document.getElementById('demo').setAttribute('aria-pressed',String(demo));announcement.textContent=demo?'Demo path running':'Follow pointer';}
document.getElementById('demo').onclick=()=>setDemo(!demo);
function setPause(){paused=!paused;const b=document.getElementById('pause');b.textContent=paused?'Resume':'Pause';b.setAttribute('aria-pressed',String(paused));announcement.textContent=paused?'Paused':'Resumed';}
document.getElementById('pause').onclick=setPause;
document.getElementById('size').oninput=e=>{size=+e.target.value;needsRender=true;};
document.getElementById('reach').oninput=e=>{reach=+e.target.value;needsRender=true;};
document.getElementById('follow').oninput=e=>{followSpeed=+e.target.value;needsRender=true;};
const gentleInput=document.getElementById('gentle');gentleInput.checked=gentle;gentleInput.onchange=e=>{gentle=e.target.checked;};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));for(const s of spirits)s.ready=false;needsRender=true;announcement.textContent=mode==='both'?'Ghost and wisp':mode;});
canvas.addEventListener('keydown',e=>{const keys={ArrowLeft:[-40,0],ArrowRight:[40,0],ArrowUp:[0,-40],ArrowDown:[0,40]};if(keys[e.key]){e.preventDefault();setDemo(false);active=true;hasTarget=true;pointer.x=clamp(pointer.x+keys[e.key][0],30,W-30);pointer.y=clamp(pointer.y+keys[e.key][1],35,H-60);}if(e.code==='Space'){e.preventDefault();if(!e.repeat)setPause();}});
function curve(points,close=false){ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(let i=0;i<points.length-1;i++){const a=points[Math.max(0,i-1)],b=points[i],c=points[i+1],d=points[Math.min(points.length-1,i+2)];ctx.bezierCurveTo(b.x+(c.x-a.x)/6,b.y+(c.y-a.y)/6,c.x-(d.x-b.x)/6,c.y-(d.y-b.y)/6,c.x,c.y);}if(close)ctx.closePath();}
function ribbon(points,widths,offset=0,factor=1){const left=[],right=[];for(let i=0;i<points.length;i++){const a=points[Math.max(0,i-1)],b=points[Math.min(points.length-1,i+1)];const dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l,w=widths[i];left.push({x:points[i].x+nx*w*(offset+factor),y:points[i].y+ny*w*(offset+factor)});right.push({x:points[i].x+nx*w*(offset-factor),y:points[i].y+ny*w*(offset-factor)});}curve(left.concat(right.reverse()),true);}
function update(s,dt,tx,ty){
const scale=size*Math.min(1,W/700),r=(s.kind==='ghost'?40:33)*scale;
if(!s.ready){s.x=tx;s.y=ty;s.vx=s.vy=0;s.folds=[];s.ready=true;}
const ax=(tx-s.x)*(gentle?13:22)*followSpeed-s.vx*(gentle?7.5:8.5),ay=(ty-s.y)*(gentle?13:22)*followSpeed-s.vy*(gentle?7.5:8.5);
s.vx+=ax*dt;s.vy+=ay*dt;const v=Math.hypot(s.vx,s.vy),max=gentle?520:1100;if(v>max){s.vx*=max/v;s.vy*=max/v;}s.x+=s.vx*dt;s.y+=s.vy*dt;
s.speed=mix(s.speed,Math.hypot(s.vx,s.vy),1-Math.exp(-dt*5));
const want=s.speed>14?Math.atan2(s.vy,s.vx):-.22+Math.sin(time*.45)*.22;
const delta=Math.atan2(Math.sin(want-s.angle),Math.cos(want-s.angle));s.turn=mix(s.turn,delta,1-Math.exp(-dt*6));s.angle+=delta*(1-Math.exp(-dt*(gentle?3:6)));
const speed=clamp(s.speed/650,0,1),dir={x:Math.cos(s.angle),y:Math.sin(s.angle)},normal={x:-dir.y,y:dir.x};
const specs=s.kind==='ghost'?[[-.72,1.35,.42],[-.18,.94,.62],[.42,1.12,.49],[.78,.70,.30]]:[[-.45,1.0,.76],[.22,1.12,.85],[.62,.78,.57]];
for(let j=0;j<specs.length;j++){
const [spread,len,width]=specs[j],N=23;if(!s.folds[j])s.folds[j]=Array.from({length:N},()=>({x:s.x,y:s.y,vx:0,vy:0}));
const f=s.folds[j];
for(let i=0;i<N;i++){const u=i/(N-1),tail=(1-Math.cos(u*Math.PI/2));
const length=r*(2.55+speed*1.45)*len*reach;
const curl=Math.sin(u*4.7-time*(gentle?.8:1.5)+j*1.4)*r*.36*u*u;
const spreadOut=spread*r*(.65+Math.sin(u*Math.PI)*.85);
const tipCurl=Math.sin(u*Math.PI*1.45)*r*.65*(1-speed*.6)*u;
const hook=clamp((u-.65)/.35,0,1);
const back=u*length+r*.28-Math.sin(hook*Math.PI*.85)*r*.55;
const sideways=spreadOut+curl+tipCurl+s.turn*r*u*.6+(1-Math.cos(hook*Math.PI)) * r*.32*(j%2?1:-1);
const x=s.x-dir.x*back+normal.x*sideways;
const y=s.y-dir.y*back+normal.y*sideways;
const follow=i===0?1:1-Math.exp(-dt*(40-30*tail));
if(!f[i].initialized){f[i].x=x;f[i].y=y;f[i].initialized=true;}else{f[i].x=mix(f[i].x,x,follow);f[i].y=mix(f[i].y,y,follow);}
if(i>0){const previous=f[i-1],dx=f[i].x-previous.x,dy=f[i].y-previous.y,distance=Math.hypot(dx,dy),limit=length/(N-1)*1.9+r*.035;if(distance>limit){f[i].x=previous.x+dx/distance*limit;f[i].y=previous.y+dy/distance*limit;}}
f[i].width=r*width*Math.pow(1-u,.85)*(.68+Math.sin(u*Math.PI)*.40)*(1+.07*Math.sin(time*2-u*5+j));
}
}
s.radius=r;s.normal=normal;s.dir=dir;}
function paintFold(s,f,j){
const w=f.map(p=>p.width),tip=f[f.length-1];
const grad=ctx.createLinearGradient(f[0].x,f[0].y,tip.x,tip.y);
if(s.kind==='ghost'){grad.addColorStop(0,'rgba(225,237,218,.98)');grad.addColorStop(.32,'rgba(174,206,202,.88)');grad.addColorStop(.72,'rgba(139,179,191,.66)');grad.addColorStop(1,'rgba(179,210,203,.10)');}
else{grad.addColorStop(0,'rgba(206,245,213,.40)');grad.addColorStop(.3,'rgba(126,221,216,.40)');grad.addColorStop(.7,'rgba(120,217,215,.25)');grad.addColorStop(1,'rgba(159,230,221,.015)');}
ribbon(f,w);ctx.fillStyle=grad;ctx.fill();
const bands=s.kind==='ghost'?5:4;
for(let k=0;k<bands;k++){const off=-.82+k*1.64/(bands-1);const inner=f.map((p,i)=>{const u=i/(f.length-1);return{x:p.x+s.normal.x*Math.sin(u*7+time*.8+j+k*.45)*s.radius*.055*u,y:p.y+s.normal.y*Math.sin(u*7+time*.8+j+k*.45)*s.radius*.055*u};});ribbon(inner,w,off,.23+.08*Math.sin(k*2+j));ctx.fillStyle=s.kind==='ghost'?`rgba(${k%3?224:110},${k%3?237:164},${k%3?218:184},${k%3?.10:.11})`:`rgba(196,255,236,${k%2?.08:.14})`;ctx.fill();}
ribbon(f,w,-.78,.025);ctx.fillStyle=s.kind==='ghost'?'rgba(236,245,223,.16)':'rgba(206,255,245,.28)';ctx.fill();
}
function headPath(s,scale=1){const points=[],r=s.radius*scale,breath=1+Math.sin(time*2.1)*.025;for(let i=0;i<=40;i++){const a=i/40*TAU,back=Math.cos(a-s.angle),wave=Math.sin(a*3+time*1.2)*.018+Math.sin(a*5-time*.7)*.012;const rad=r*(1+wave)*breath*(1+Math.max(0,-back)*(s.kind==='ghost'?.20:.12));points.push({x:s.x+Math.cos(a)*rad*(1+clamp(s.speed/800,0,.1)*.15),y:s.y+Math.sin(a)*rad*(.94+back*.025)});}curve(points,true);}
function drawGhost(s){
for(let j=0;j<s.folds.length;j++)paintFold(s,s.folds[j],j);
const r=s.radius,d=s.dir;
headPath(s);const base=ctx.createRadialGradient(s.x+r*.28,s.y-r*.4,r*.05,s.x-r*.18,s.y+r*.1,r*1.2);base.addColorStop(0,'#f2f0d9');base.addColorStop(.5,'#dce7d5');base.addColorStop(1,'#9bbfbe');ctx.fillStyle=base;ctx.fill();
ctx.save();headPath(s);ctx.clip();
for(let j=0;j<5;j++){const x=s.x-r*.65+j*r*.28;ctx.beginPath();ctx.moveTo(x-r*.5,s.y-r);ctx.bezierCurveTo(x+r*.6,s.y-r*.7,x-r*.4,s.y+r*.2,x+r*.7,s.y+r);ctx.lineTo(x+r*.9,s.y+r);ctx.bezierCurveTo(x,s.y,x+r*.9,s.y-r*.6,x-r*.15,s.y-r);ctx.closePath();ctx.fillStyle=j%2?'rgba(255,253,220,.035)':'rgba(119,169,181,.025)';ctx.fill();}
ctx.restore();
const lookX=d.x*r*.20,lookY=d.y*r*.16,blink=Math.pow(Math.max(0,Math.cos(time*.7)),90);
for(let side of [-1,1]){const x=s.x+side*r*.28+lookX,y=s.y+r*.1+lookY;ctx.save();ctx.translate(x,y);ctx.rotate(side*.1+d.y*.10);ctx.beginPath();ctx.ellipse(0,0,r*(side===1?.12:.145),r*.23*(1-blink*.87),0,0,TAU);const eye=ctx.createLinearGradient(0,-r*.2,0,r*.2);eye.addColorStop(0,'#173948');eye.addColorStop(1,'#305765');ctx.fillStyle=eye;ctx.fill();if(blink<.5){ctx.beginPath();ctx.ellipse(r*.025,-r*.065,r*.028,r*.044,0,0,TAU);ctx.fillStyle='rgba(153,209,208,.6)';ctx.fill();}ctx.restore();}
}
function drawWisp(s){
const r=s.radius;
const halo=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,r*2.1);halo.addColorStop(0,'rgba(136,232,201,.14)');halo.addColorStop(.5,'rgba(103,216,195,.055)');halo.addColorStop(1,'rgba(103,216,195,0)');ctx.fillStyle=halo;ctx.beginPath();ctx.arc(s.x,s.y,r*2.1,0,TAU);ctx.fill();
for(let j=0;j<s.folds.length;j++)paintFold(s,s.folds[j],j);
headPath(s,1.04);const body=ctx.createRadialGradient(s.x+r*.18,s.y+r*.14,r*.06,s.x,s.y,r*1.1);body.addColorStop(0,'rgba(250,246,199,.90)');body.addColorStop(.35,'rgba(229,246,204,.80)');body.addColorStop(.65,'rgba(144,225,204,.46)');body.addColorStop(1,'rgba(149,233,221,0)');ctx.fillStyle=body;ctx.fill();
for(let j=0;j<3;j++){
const pts=[],widths=[];for(let i=0;i<25;i++){const u=i/24,a=-.7+u*3.5+time*.30+j*1.8;const rr=r*(.40+u*.48+.06*Math.sin(time*1.6+j));pts.push({x:s.x+Math.cos(a)*rr,y:s.y+Math.sin(a)*rr*.93});widths.push(r*.22*Math.sin(u*Math.PI));}
ribbon(pts,widths);ctx.fillStyle=j===0?'rgba(244,252,211,.25)':'rgba(172,242,226,.18)';ctx.fill();ribbon(pts,widths,.7,.045);ctx.fillStyle='rgba(226,255,235,.26)';ctx.fill();}
const heart=ctx.createRadialGradient(s.x+r*.15,s.y+r*.12,0,s.x+r*.04,s.y+r*.06,r*.7);heart.addColorStop(0,'rgba(255,252,217,.76)');heart.addColorStop(.35,'rgba(255,250,205,.37)');heart.addColorStop(1,'rgba(245,250,207,0)');ctx.fillStyle=heart;ctx.beginPath();ctx.arc(s.x,s.y,r,0,TAU);ctx.fill();
}
function frame(now){const dt=Math.min((now-last)/1000||1/60,.033);last=now;if(!paused||needsRender){const step=paused?0:dt;needsRender=false;time+=step;ctx.clearRect(0,0,W,H);const bg=ctx.createRadialGradient(W*.48,H*.44,20,W*.5,H*.5,W*.75);bg.addColorStop(0,'#344b3d');bg.addColorStop(1,'#20352f');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
let tx=pointer.x,ty=pointer.y;if(demo){tx=W*.5+Math.cos(time*.63)*W*.27;ty=H*.46+Math.sin(time*.94)*H*.22;}else if(!hasTarget){tx=W*.55;ty=H*.46;}
const selected=spirits.filter(s=>mode==='both'||mode===s.kind);for(const s of selected){const offset=mode==='both'?(s.kind==='ghost'?-1:1)*Math.min(105,W*.18):0;update(s,step,clamp(tx+offset,65,W-65),clamp(ty+(mode==='both'?Math.sin(time*.8+(s.kind==='ghost'?0:2))*9:0),65,H-120));}
for(const s of selected){if(s.kind==='ghost')drawGhost(s);else drawWisp(s);}
if(active||demo){ctx.beginPath();ctx.arc(tx,ty,4,0,TAU);ctx.strokeStyle='rgba(222,235,208,.25)';ctx.lineWidth=1;ctx.stroke();}
const fastest=Math.max(...selected.map(s=>s.speed)),turn=Math.max(...selected.map(s=>Math.abs(s.turn)));const text=fastest<25?'Gathering':turn>.45?'Turning':fastest>240?'Pursuing':'Drifting';if(stateLabel.textContent!==text)stateLabel.textContent=text;
}
requestAnimationFrame(frame);}
requestAnimationFrame(frame);
window.spiritStudy={snapshot:()=>({mode,paused,demo,time,width:W,height:H,spirits:spirits.map(s=>({kind:s.kind,x:s.x,y:s.y,speed:s.speed,angle:s.angle,folds:s.folds.map(f=>f.map(p=>({x:p.x,y:p.y})))}))})};
})();
</script>
</body>
</html>
